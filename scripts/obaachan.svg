<!-- デモ用の案内人「おばあちゃん」の元絵（自作）。左が正面、右が背面。白背景。
     sharp で assets/figures/obaachan.png に書き出し（node -e "require('sharp')('scripts/obaachan.svg').png().toFile('assets/figures/obaachan.png')"）、npm run prepare:figure で AR の素材にする -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <rect width="1600" height="1400" fill="#ffffff"/>
  <defs>
    <g id="legs">
      <!-- 足袋と草履 -->
      <rect x="330" y="1250" width="60" height="70" rx="20" fill="#efe9dc" stroke="#3b2f2a" stroke-width="6"/>
      <rect x="410" y="1250" width="60" height="70" rx="20" fill="#efe9dc" stroke="#3b2f2a" stroke-width="6"/>
      <rect x="310" y="1312" width="95" height="22" rx="10" fill="#8a5a3b" stroke="#3b2f2a" stroke-width="6"/>
      <rect x="395" y="1312" width="95" height="22" rx="10" fill="#8a5a3b" stroke="#3b2f2a" stroke-width="6"/>
    </g>
  </defs>

  <!-- ===== 正面 ===== -->
  <g>
    <use href="#legs"/>
    <!-- 着物（藍色の絣） -->
    <path d="M250 560 Q400 500 550 560 L600 1260 Q400 1290 200 1260 Z" fill="#2f4a7a" stroke="#1f2937" stroke-width="8"/>
    <g fill="#9fb3d9" opacity="0.8">
      <rect x="260" y="1000" width="18" height="10"/><rect x="320" y="1080" width="18" height="10"/>
      <rect x="520" y="1010" width="18" height="10"/><rect x="470" y="1110" width="18" height="10"/>
      <rect x="250" y="1180" width="18" height="10"/><rect x="540" y="1190" width="18" height="10"/>
    </g>
    <!-- 割烹着（えんじの前掛け） -->
    <path d="M290 600 Q400 560 510 600 L540 1180 Q400 1205 260 1180 Z" fill="#b5444b" stroke="#5b1d22" stroke-width="7"/>
    <path d="M300 760 L500 760" stroke="#5b1d22" stroke-width="6"/>
    <!-- ポケットに「案内」 -->
    <rect x="345" y="880" width="110" height="80" rx="10" fill="#f5e6c8" stroke="#5b1d22" stroke-width="6"/>
    <text x="400" y="935" font-family="Hiragino Sans, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#5b1d22">案内</text>
    <!-- 袖と腕。右手を上げて手招き -->
    <path d="M255 570 Q170 640 170 830 L235 850 Q245 700 300 640 Z" fill="#2f4a7a" stroke="#1f2937" stroke-width="8"/>
    <circle cx="205" cy="870" r="34" fill="#f2c9a5" stroke="#3b2f2a" stroke-width="6"/>
    <path d="M545 570 Q640 560 680 430 L620 400 Q590 510 500 620 Z" fill="#2f4a7a" stroke="#1f2937" stroke-width="8"/>
    <ellipse cx="655" cy="385" rx="34" ry="40" fill="#f2c9a5" stroke="#3b2f2a" stroke-width="6"/>
    <!-- 杖 -->
    <path d="M205 870 L190 1320" stroke="#7a4b2a" stroke-width="16" stroke-linecap="round"/>
    <!-- 首と顔 -->
    <rect x="370" y="490" width="60" height="70" fill="#f2c9a5" stroke="#3b2f2a" stroke-width="6"/>
    <path d="M330 560 L400 640 L470 560" fill="#efe9dc" stroke="#3b2f2a" stroke-width="6"/>
    <ellipse cx="400" cy="400" rx="125" ry="135" fill="#f2c9a5" stroke="#3b2f2a" stroke-width="8"/>
    <!-- 白髪とおだんご -->
    <path d="M275 390 Q270 250 400 245 Q530 250 525 390 Q500 300 400 300 Q300 300 275 390 Z" fill="#d7d7dc" stroke="#6b7280" stroke-width="7"/>
    <circle cx="400" cy="215" r="58" fill="#d7d7dc" stroke="#6b7280" stroke-width="7"/>
    <rect x="365" y="200" width="70" height="12" rx="6" fill="#b5444b"/>
    <!-- めがね -->
    <circle cx="352" cy="405" r="34" fill="none" stroke="#7c5c2e" stroke-width="6"/>
    <circle cx="448" cy="405" r="34" fill="none" stroke="#7c5c2e" stroke-width="6"/>
    <path d="M386 405 L414 405" stroke="#7c5c2e" stroke-width="6"/>
    <!-- にっこり -->
    <path d="M335 405 Q352 390 369 405" fill="none" stroke="#3b2f2a" stroke-width="6" stroke-linecap="round"/>
    <path d="M431 405 Q448 390 465 405" fill="none" stroke="#3b2f2a" stroke-width="6" stroke-linecap="round"/>
    <path d="M360 470 Q400 505 440 470" fill="none" stroke="#3b2f2a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="315" cy="450" r="18" fill="#f09a9a" opacity="0.6"/>
    <circle cx="485" cy="450" r="18" fill="#f09a9a" opacity="0.6"/>
  </g>

  <!-- ===== 背面 ===== -->
  <g transform="translate(800 0)">
    <use href="#legs"/>
    <path d="M250 560 Q400 500 550 560 L600 1260 Q400 1290 200 1260 Z" fill="#2f4a7a" stroke="#1f2937" stroke-width="8"/>
    <g fill="#9fb3d9" opacity="0.8">
      <rect x="280" y="900" width="18" height="10"/><rect x="480" y="950" width="18" height="10"/>
      <rect x="330" y="1100" width="18" height="10"/><rect x="510" y="1150" width="18" height="10"/>
    </g>
    <!-- 割烹着のひも -->
    <path d="M260 760 L540 760" stroke="#b5444b" stroke-width="14"/>
    <path d="M400 760 L360 840 M400 760 L440 840" stroke="#b5444b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="400" cy="760" r="16" fill="#b5444b" stroke="#5b1d22" stroke-width="5"/>
    <!-- 袖 -->
    <path d="M255 570 Q170 640 170 830 L235 850 Q245 700 300 640 Z" fill="#2f4a7a" stroke="#1f2937" stroke-width="8"/>
    <path d="M545 570 Q630 640 630 830 L565 850 Q555 700 500 640 Z" fill="#2f4a7a" stroke="#1f2937" stroke-width="8"/>
    <circle cx="595" cy="870" r="34" fill="#f2c9a5" stroke="#3b2f2a" stroke-width="6"/>
    <path d="M595 870 L610 1320" stroke="#7a4b2a" stroke-width="16" stroke-linecap="round"/>
    <!-- 首と頭（後ろ） -->
    <rect x="370" y="490" width="60" height="70" fill="#f2c9a5" stroke="#3b2f2a" stroke-width="6"/>
    <ellipse cx="400" cy="400" rx="125" ry="135" fill="#d7d7dc" stroke="#6b7280" stroke-width="8"/>
    <path d="M320 330 Q400 300 480 330 M310 400 Q400 370 490 400" fill="none" stroke="#9ca3af" stroke-width="5"/>
    <circle cx="400" cy="230" r="62" fill="#d7d7dc" stroke="#6b7280" stroke-width="7"/>
    <path d="M345 205 L455 255" stroke="#7c5c2e" stroke-width="8" stroke-linecap="round"/>
    <rect x="365" y="270" width="70" height="12" rx="6" fill="#b5444b"/>
  </g>
</svg>
